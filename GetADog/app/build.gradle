plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'

    id 'kotlin-kapt'
    id 'realm-android'
    //id 'io.realm.kotlin' version '1.0.0'

    // Apply the JVM toolchain plugin
    //id 'java-library'
    //id 'org.jetbrains.kotlin.jvm' version '1.5.20'
    id 'org.jetbrains.kotlin.plugin.allopen' version '1.5.20'
    id 'org.jetbrains.dokka' version '1.5.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.5.20'
}

android {
    namespace 'com.example.getadog'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.getadog"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11          //VERSION_1_8
        targetCompatibility JavaVersion.VERSION_11
    }
//    kotlinOptions {
//        jvmTarget = '1.8'
//    }

    buildFeatures {
        dataBinding true
    }

    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(11))
        }
    }
//
//    // Αφαιρέστε την παλιά δήλωση του JVM toolchain (αν υπάρχει)
//    // και αντικαταστήστε τη με την παρακάτω:
//    tasks.withType<KotlinCompile>().configureEach {
//        kotlinOptions.jvmTarget = "11"
//    }


//    // Define the JVM toolchain
//    java {
//        toolchain {
//            languageVersion.set(JavaLanguageVersion.of(11))
//        }
////        toolchain {
////            languageVersion = JavaLanguageVersion.of(11)
////        }
//    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "11"
        }
    }

    //    dataBinding {
    //        enabled = true
    //    }
//    // Realm configuration
//    realm {
//        syncEnabled = true
//    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Realm
//    annotationProcessor('io.realm:realm-android:1.10.1')
//    implementation 'io.realm:realm-android:1.10.1'

    // Realm dependencies
//    annotationProcessor('io.realm:realm-android:1.0.0')
//    implementation 'io.realm:realm-android:1.0.0'

    // Coil
    implementation 'io.coil-kt:coil:2.4.0'

    // Fragment Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.0-beta02'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.0-beta02'

    implementation 'com.github.bumptech.glide:glide:4.12.0'

    // Add the Coil dependence
    implementation 'io.coil-kt:coil:2.4.0'

    // Add dependence for Fragment Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.6.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.6.0'

    //kapt "com.android.databinding:compiler:$android_plugin_version"

    //annotationProcessor "com.android.databinding:compiler:$android_plugin_version"
}

